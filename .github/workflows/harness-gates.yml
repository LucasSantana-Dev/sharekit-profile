name: Harness Gates

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]
  # Dispatched by release-please.yml: PRs it opens with GITHUB_TOKEN do not
  # trigger pull_request workflows, so the gates are started explicitly.
  workflow_dispatch:

jobs:
  harness-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check harness/app boundary
        run: bash scripts/check-harness-boundary.sh

  coauthor-trailers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for bot Co-authored-by trailers
        run: python3 scripts/check-coauthor-trailers.py

  harness-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify harness manifest fingerprints
        run: bash scripts/check-harness-manifest.sh

  marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate marketplace manifest (structural)
        # JSON parse + source paths exist + name/description/version per plugin
        # + curated-*.txt sync (scripts/check-marketplace.sh).
        run: bash scripts/check-marketplace.sh
      - name: Validate with claude CLI when available
        # ubuntu-latest has no claude CLI today; structural checks above are the
        # gate, this upgrades to the official validator if the image gains one.
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate .
          else
            echo "claude CLI not available on runner; structural checks only"
          fi

  bats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install bats-core + gate-script dependencies
        # skill-validate.sh hard-requires fd + rg (exits 2 without them).
        # Debian packages fd as fd-find with binary name fdfind — symlink it.
        # apt is skipped when the tools exist and bounded (timeout + retries)
        # otherwise, so a hung mirror fails fast instead of hanging the job.
        run: |
          pkgs=()
          command -v bats >/dev/null 2>&1 || pkgs+=(bats)
          command -v rg >/dev/null 2>&1 || pkgs+=(ripgrep)
          command -v fd >/dev/null 2>&1 || command -v fdfind >/dev/null 2>&1 || pkgs+=(fd-find)
          if [ "${#pkgs[@]}" -gt 0 ]; then
            apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30)
            sudo timeout 300 apt-get "${apt_opts[@]}" update
            sudo timeout 300 apt-get "${apt_opts[@]}" install -y "${pkgs[@]}"
          fi
          command -v fd >/dev/null 2>&1 || sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
      - name: Run gate script tests
        run: bats tests/
      - name: Check redirects.yaml / composites.md sync
        # Runs in this job because it needs rg (installed above); previously
        # orphaned — the script existed but no CI job or hook invoked it.
        run: bash scripts/check-redirects-sync.sh

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scanning with gitleaks
        uses: gitleaks/gitleaks-action@v3
        # Note: GITLEAKS_LICENSE is only required for some org accounts.
        # Individual and most org repos can omit this. If the action fails on a
        # license check, add the GITLEAKS_LICENSE secret to enable scanning on
        # org plans. For community use, this action requires no license.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check shell scripts with shellcheck
        # Note: shellcheck is preinstalled on GitHub Actions ubuntu runners.
        # This gate checks all hook and script shell files at warning severity.
        run: shellcheck -S warning hooks/*.sh hooks/shared/*.sh scripts/*.sh
      - name: Check published hooks with shellcheck (error-only)
        # claude/hooks/*.sh added 2026-07-25: these are the hooks that actually ship to
        # installers via `sharekit install` and had ZERO CI coverage before this. Error-only
        # (not -S warning like the gate above) because claude/hooks/ has ~20 pre-existing
        # warning-level findings across unrelated files - turning those into a hard block
        # is a separate cleanup pass, not something to bundle into closing the coverage gap.
        # Note: this wouldn't have caught the actual harness-vitals.sh mount-guard bug this
        # session found - that was a semantic/logic issue (grep's empty-pattern-matches-all
        # behavior), not something shellcheck detects at any severity. This closes the "zero
        # coverage" gap for real breakage (syntax errors, etc.), not a guarantee against that
        # specific bug class.
        run: shellcheck -S error claude/hooks/*.sh

  hooks-bash32:
    # Stock macOS ships /bin/bash 3.2.57, which parses differently from the bash on
    # ubuntu runners (for example apostrophes in a heredoc nested in $( ) are a syntax
    # error there). Parse every shipped hook with the interpreter installers actually get.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Parse claude/hooks/*.sh and hooks/*.sh with /bin/bash (3.2)
        run: |
          /bin/bash --version | head -1
          fail=0
          for f in claude/hooks/*.sh hooks/*.sh; do
            /bin/bash -n "$f" || { echo "syntax error under /bin/bash: $f"; fail=1; }
          done
          exit "$fail"
      - name: Registered hooks exist, are curated, and avoid bash 4 features
        run: python3 scripts/check-settings-hooks.py
