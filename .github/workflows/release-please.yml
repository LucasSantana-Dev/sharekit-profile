name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Manifest mode: release-type ("simple") lives in release-please-config.json;
      # setting it here would make the action ignore the config + manifest files.
      - uses: googleapis/release-please-action@v5
        id: rp
      # Release PRs opened with GITHUB_TOKEN do not trigger pull_request
      # workflows, so no required check would ever report on them. workflow_dispatch
      # started with GITHUB_TOKEN does run, and attaches the checks to the branch head.
      - name: Run Harness Gates on the release PR branch
        if: ${{ steps.rp.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RP_BRANCH: ${{ fromJSON(steps.rp.outputs.pr).headBranchName }}
        run: gh workflow run harness-gates.yml --repo "$GITHUB_REPOSITORY" --ref "$RP_BRANCH"
