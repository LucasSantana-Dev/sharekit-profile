name: Claude Code changelog watch

# Monthly: list Claude Code releases newer than .harness/claude-code-reviewed
# whose changelog lines touch hooks, skills, plugins, settings, MCP or models,
# and keep one open issue with that list.
on:
  schedule:
    - cron: "17 9 1 * *"  # 1st of each month, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Build report
        run: bash scripts/claude-code-changelog-watch.sh > report.md
      - name: Open or update the review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s report.md ] || { echo "No new Claude Code releases to review."; exit 0; }
          title="Review Claude Code changes for the harness"
          num="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file report.md
          else
            gh issue create --title "$title" --body-file report.md
          fi
